name: llama.cpp Linux prebuilts

# Build Linux llama.cpp binaries that upstream ggml-org/llama.cpp does not ship
# (CUDA), and host them as release assets on THIS repo so the installers can
# download them on the existing releases/download/<tag>/<asset> code path
# (service/lib-llamacpp.sh). See docs/llamacpp-prebuilt-hosting-plan.md.
#
# Trigger: push a git tag named after the llama.cpp build to build, e.g. `b10068`
# (mirrors the v*-tag flow of the Release workflow; GitHub Desktop: right-click a
# commit -> Create Tag -> push). The tag name IS the upstream llama.cpp tag: this
# workflow checks out ggml-org/llama.cpp at that tag and publishes a same-named
# release here. The Release workflow only fires on `v*`, so `b*` never collides
# with an agent release, and make_latest:false keeps these off "Latest".
#
# NOTE: with a tag-push trigger GitHub runs the workflow AS IT EXISTS AT THE
# TAGGED COMMIT — so the commit you tag must already contain this file. Tag a
# commit on the default branch (or any branch) that includes it.
#
# workflow_dispatch is kept as a manual fallback (re-run a tag's build without
# recreating the tag, and the only way to opt into mirror_backends).
#
# Publishing uses the built-in GITHUB_TOKEN (contents: write). Catalog signing
# uses the same MINISIGN_SECRET_KEY secret as the agent release workflow.

on:
  schedule:
    # llama.cpp commonly publishes several builds per day. Promote the newest
    # complete upstream build once a week (Mondays 08:17 UTC) rather than daily.
    - cron: "17 8 * * 1"
  push:
    tags:
      - "b[0-9]*" # llama.cpp build tags, e.g. b10068 (the [0-9] avoids matching `beta` etc.)
  workflow_dispatch:
    inputs:
      tag:
        description: "llama.cpp release tag to build (e.g. b10068)"
        required: true
        type: string
      mirror_backends:
        description: "Also mirror upstream ROCm/Vulkan/CPU Linux assets into this release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            push) TAG="$PUSH_TAG" ;;
            schedule)
              # Upstream now marks a semver release (e.g. v0.2.0) as "Latest" and
              # flags every rolling build (bNNNNN) as a prerelease, so
              # /releases/latest no longer returns a b-tag. List releases and take
              # the newest non-draft bNNNNN instead (releases come newest-first).
              TAG="$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=50' \
                --jq 'map(select(.draft == false and (.tag_name | test("^b[0-9]+$"))))
                      | first | .tag_name // ""')"
              ;;
            *) echo "unsupported event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          [[ "$TAG" =~ ^b[0-9]+$ ]] || { echo "invalid llama.cpp tag: $TAG" >&2; exit 2; }

          SHOULD_BUILD=true
          if [[ "$EVENT_NAME" == schedule ]]; then
            release="$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null || true)"
            stable="$(gh api "repos/$REPO/releases/tags/llamacpp-stable" 2>/dev/null || true)"
            stable_tag="$(curl -fsSL \
              "https://github.com/$REPO/releases/download/llamacpp-stable/llamacpp-release.json?run=$GITHUB_RUN_ID" \
              | jq -r '.tag' 2>/dev/null || true)"
            if [[ -n "$release" ]] && jq -e --arg tag "$TAG" '
              [.assets[].name] as $names
              | ($names | index("llama-" + $tag + "-bin-ubuntu-cuda-12.4-x64.tar.gz")) != null
              and ($names | index("llama-" + $tag + "-bin-ubuntu-cuda-13.3-x64.tar.gz")) != null
              and ($names | index("llamacpp-release.json")) != null
              and ($names | index("llamacpp-release.json.minisig")) != null
            ' <<<"$release" >/dev/null \
              && [[ -n "$stable" ]] \
              && jq -e '[.assets[].name] as $names | ($names | index("llamacpp-release.json")) != null and ($names | index("llamacpp-release.json.minisig")) != null' \
                <<<"$stable" >/dev/null \
              && [[ "$stable_tag" == "$TAG" ]]; then
              SHOULD_BUILD=false
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG (build=$SHOULD_BUILD)"

  build-cuda:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 12.4: Turing..Hopper. Floor for older drivers; no Blackwell (needs 12.8+).
          - variant: "12.4"
            image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
            archs: "75;80;86;89;90"
          # 13.3: adds Blackwell (sm_100/sm_120). Requires a newer NVIDIA driver.
          - variant: "13.3"
            image: "nvidia/cuda:13.3.0-devel-ubuntu22.04"
            archs: "75;80;86;89;90;100;120"
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    # The llama.cpp tag = the pushed git tag (ref_name) on a tag push, or the
    # dispatch input on a manual run. Used as $TAG in every step below.
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # Build deps. The CUDA devel image ships nvcc + the host compiler but not
      # cmake/git/patchelf. Runs before checkout because we don't need this repo.
      - name: Install build deps
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake ninja-build build-essential patchelf ca-certificates file

      - name: Checkout llama.cpp @ ${{ env.TAG }}
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.TAG }}
          path: llama.cpp

      - name: Configure + build llama-server (CUDA ${{ matrix.variant }})
        working-directory: llama.cpp
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.archs }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build build --target llama-server -j"$(nproc)"

      - name: Stage + bundle CUDA runtime libs
        working-directory: llama.cpp
        run: |
          set -eux
          NAME="llama-$TAG-bin-ubuntu-cuda-${{ matrix.variant }}-x64"
          PKG="$GITHUB_WORKSPACE/dist/$NAME"
          mkdir -p "$PKG"

          cp build/bin/llama-server "$PKG/"
          # Any co-located shared libs the build emitted (usually none: static build).
          find build/bin -maxdepth 1 -name '*.so*' -exec cp -av {} "$PKG/" \; || true

          # Bundle exactly the CUDA runtime libs the binary resolves — libcudart,
          # libcublas, libcublasLt. Deliberately NOT libcuda.so.1: that is the
          # driver stub in CI and must come from the target's real NVIDIA driver.
          # ldd prints the SONAME path (e.g. .../libcudart.so.12); cp -L keeps that
          # SONAME as the destination filename with real contents.
          ldd build/bin/llama-server \
            | awk '/libcudart|libcublas|libcublasLt/ {print $3}' \
            | while read -r so; do [ -n "$so" ] && cp -Lv "$so" "$PKG/"; done

          # Resolve bundled libs next to the binary at run time.
          patchelf --set-rpath '$ORIGIN' "$PKG/llama-server"

          echo "== packaged files =="; ls -la "$PKG"
          echo "== NEEDED / RPATH =="; readelf -d "$PKG/llama-server" | grep -Ei 'needed|rpath|runpath'

      - name: Structural check (GPU-independent gate)
        working-directory: llama.cpp
        run: |
          set -eux
          NAME="llama-$TAG-bin-ubuntu-cuda-${{ matrix.variant }}-x64"
          PKG="$GITHUB_WORKSPACE/dist/$NAME"
          BIN="$PKG/llama-server"
          file "$BIN" | grep -q 'ELF 64-bit'
          # RUNPATH/RPATH must be $ORIGIN so the bundled libs are found on target.
          readelf -d "$BIN" | grep -Eiq '\$ORIGIN'
          # cudart must be a bundled NEEDED lib.
          readelf -d "$BIN" | grep -Eiq 'libcudart'
          # The bundled runtime libs must physically be in the package.
          ls "$PKG"/libcudart.so.* "$PKG"/libcublas.so.* "$PKG"/libcublasLt.so.*

      - name: Smoke test --version (informational; GPU-less runner)
        working-directory: llama.cpp
        run: |
          # Informational only, never fails the build: the runner has no GPU/driver,
          # so llama-server can't fully load (libcuda.so.1 comes from the driver).
          # We point at the toolkit's libcuda stub just to satisfy the loader so
          # --version can print before any CUDA context — but even that often can't
          # link on a driverless box (exit 127 = missing shared lib), which is
          # expected. The "Structural check" step above is the real gate.
          set -ux
          NAME="llama-$TAG-bin-ubuntu-cuda-${{ matrix.variant }}-x64"
          BIN="$GITHUB_WORKSPACE/dist/$NAME/llama-server"
          STUB="$(dirname "$(find /usr/local/cuda -name 'libcuda.so' -path '*stubs*' 2>/dev/null | head -n1)")"
          if [ -n "$STUB" ] && [ "$STUB" != "." ]; then
            ln -sf libcuda.so "$STUB/libcuda.so.1" || true
            if LD_LIBRARY_PATH="$STUB" "$BIN" --version; then
              echo "   smoke test: llama-server --version ran"
            else
              echo "   smoke test: could not run on this GPU-less runner (exit $?) — expected; structural gate already passed"
            fi
          else
            echo "   smoke test: no libcuda stub on runner; skipped (structural gate already passed)"
          fi
          exit 0

      - name: Package tarball
        working-directory: dist
        run: |
          set -eux
          NAME="llama-$TAG-bin-ubuntu-cuda-${{ matrix.variant }}-x64"
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" | awk '{print $1}' > "$NAME.tar.gz.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: cuda-${{ matrix.variant }}
          # Intermediate staging only — publish downloads these in the same run.
          # Short retention so per-run build artifacts don't pile up for 90 days.
          retention-days: 2
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # Optional: re-host upstream's Linux non-CUDA assets so the whole fallback chain
  # (cuda -> vulkan -> cpu, and rocm) can be pinned to a single source. Off by
  # default — this workflow's job is the CUDA gap.
  mirror-upstream:
    needs: resolve
    # Opt-in, manual only: tag pushes never mirror (there is no input to set).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_backends }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download + checksum upstream Linux assets
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          mkdir -p dist && cd dist
          BASE="https://github.com/ggml-org/llama.cpp/releases/download/$TAG"
          for a in \
            "llama-$TAG-bin-ubuntu-rocm-7.2-x64.tar.gz" \
            "llama-$TAG-bin-ubuntu-vulkan-x64.tar.gz" \
            "llama-$TAG-bin-ubuntu-vulkan-arm64.tar.gz" \
            "llama-$TAG-bin-ubuntu-x64.tar.gz" \
            "llama-$TAG-bin-ubuntu-arm64.tar.gz"; do
            # Best-effort: skip assets a given tag doesn't publish.
            if curl -fsSL "$BASE/$a" -o "$a"; then
              sha256sum "$a" | awk '{print $1}' > "$a.sha256"
            else
              echo "skip (not published at $TAG): $a"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: mirror-upstream
          # Intermediate staging only — publish downloads these in the same run.
          retention-days: 2
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    needs: [resolve, build-cuda, mirror-upstream]
    # mirror-upstream is skipped when mirror_backends=false; don't let that block us.
    if: ${{ always() && needs.build-cuda.result == 'success' }}
    # Signing/publishing does not produce target binaries, so it need not share
    # the CUDA build's Ubuntu 22.04 ABI baseline. ubuntu-latest has the minisign
    # package used successfully by release.yml; jammy's configured repositories
    # do not, which caused scheduled publish runs to fail at apt install.
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      - name: List assets
        run: ls -la staged

      - name: Publish release ${{ env.TAG }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "llama.cpp ${{ env.TAG }} — LocalLMOS Linux builds"
          body: |
            Self-hosted Linux **CUDA** builds of llama.cpp `${{ env.TAG }}`
            (upstream `ggml-org/llama.cpp` ships no Linux CUDA prebuilt).

            Built by `.github/workflows/llamacpp-prebuilt.yml` from
            `ggml-org/llama.cpp@${{ env.TAG }}`.

            - `ubuntu-cuda-12.4-x64` — sm_75/80/86/89/90 (Turing→Hopper)
            - `ubuntu-cuda-13.3-x64` — adds sm_100/120 (Blackwell); needs a newer NVIDIA driver

            Each `llama-server` bundles the CUDA runtime libs
            (`libcudart`/`libcublas`/`libcublasLt`, `$ORIGIN` rpath); the NVIDIA
            **driver** (`libcuda.so.1`) comes from the target machine. NVIDIA CUDA
            redistributable libraries are shipped under the NVIDIA CUDA EULA.
          make_latest: "false"
          prerelease: false
          files: staged/*

      - name: Build signed desktop update catalog
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          command -v minisign >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y minisign
          }
          upstream="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: locallmos-llamacpp-builder' \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/$TAG")"
          entries='[]'

          # Toolkit/runtime versions are part of upstream ROCm asset names and
          # change independently of the llama.cpp tag (7.2 -> 7.14 in b10373).
          # Resolve those names from the release instead of hard-coding them.
          find_optional_upstream_asset() {
            pattern="$1"
            jq -r --arg pattern "$pattern" '
              [.assets[].name | select(test($pattern))]
              | if length == 1 then .[0]
                elif length == 0 then empty
                else error("expected at most one asset matching " + $pattern
                  + ", found " + (length | tostring))
                end
            ' <<<"$upstream"
          }
          linux_rocm="$(find_optional_upstream_asset "^llama-${TAG}-bin-ubuntu-rocm-[0-9.]+-x64\\.tar\\.gz$")"
          windows_amd="$(find_optional_upstream_asset "^llama-${TAG}-bin-win-(hip-radeon|rocm-[0-9.]+)-x64\\.zip$")"

          append_asset() {
            os="$1" arch="$2" backend="$3" variant="$4" archive="$5" repo="$6" name="$7" companion="${8:-}"
            if [[ "$repo" == "$REPO" ]]; then
              path="staged/$name"
              [[ -f "$path" ]] || { echo "missing built asset: $name" >&2; exit 1; }
              sha="$(sha256sum "$path" | awk '{print $1}')"
              size="$(stat -c '%s' "$path")"
              url="https://github.com/$REPO/releases/download/$TAG/$name"
            else
              asset="$(jq -cer --arg name "$name" '.assets[] | select(.name == $name)' <<<"$upstream")" \
                || { echo "upstream $TAG is missing $name" >&2; exit 1; }
              url="$(jq -r '.browser_download_url' <<<"$asset")"
              size="$(jq -r '.size' <<<"$asset")"
              sha="$(jq -r '.digest // ""' <<<"$asset" | sed 's/^sha256://')"
              if [[ -z "$sha" ]]; then
                tmp="$(mktemp)"
                curl -fsSL "$url" -o "$tmp"
                sha="$(sha256sum "$tmp" | awk '{print $1}')"
                rm -f "$tmp"
              fi
            fi

            companions='[]'
            if [[ -n "$companion" ]]; then
              companion_asset="$(jq -cer --arg name "$companion" '.assets[] | select(.name == $name)' <<<"$upstream")" \
                || { echo "upstream $TAG is missing $companion" >&2; exit 1; }
              companion_url="$(jq -r '.browser_download_url' <<<"$companion_asset")"
              companion_size="$(jq -r '.size' <<<"$companion_asset")"
              companion_sha="$(jq -r '.digest // ""' <<<"$companion_asset" | sed 's/^sha256://')"
              if [[ -z "$companion_sha" ]]; then
                tmp="$(mktemp)"
                curl -fsSL "$companion_url" -o "$tmp"
                companion_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                rm -f "$tmp"
              fi
              companions="$(jq -n --arg name "$companion" --arg url "$companion_url" \
                --arg sha "$companion_sha" --argjson size "$companion_size" \
                '[{name:$name,url:$url,sha256:$sha,sizeBytes:$size}]')"
            fi

            entries="$(jq -n --argjson entries "$entries" --arg os "$os" --arg arch "$arch" \
              --arg backend "$backend" --arg variant "$variant" --arg archive "$archive" \
              --arg name "$name" --arg url "$url" --arg sha "$sha" --argjson size "$size" \
              --argjson companions "$companions" '
                $entries + [{os:$os,arch:$arch,backend:$backend,
                  variant:(if $variant == "" then null else $variant end),
                  archive:$archive,name:$name,url:$url,sha256:$sha,sizeBytes:$size,
                  companions:$companions}]')"
          }

          append_optional_asset() {
            name="$7"
            if [[ -n "$name" ]]; then
              append_asset "$@"
            else
              echo "Optional $3 artifact is unavailable for $1-$2 at $TAG; users on that backend keep their current build."
            fi
          }

          append_asset linux x86_64 cuda 12.4 tar.gz "$REPO" "llama-$TAG-bin-ubuntu-cuda-12.4-x64.tar.gz"
          append_asset linux x86_64 cuda 13.3 tar.gz "$REPO" "llama-$TAG-bin-ubuntu-cuda-13.3-x64.tar.gz"
          append_optional_asset linux x86_64 rocm '' tar.gz ggml-org/llama.cpp "$linux_rocm"
          append_asset linux x86_64 vulkan '' tar.gz ggml-org/llama.cpp "llama-$TAG-bin-ubuntu-vulkan-x64.tar.gz"
          append_asset linux x86_64 cpu '' tar.gz ggml-org/llama.cpp "llama-$TAG-bin-ubuntu-x64.tar.gz"
          append_asset macos aarch64 metal '' tar.gz ggml-org/llama.cpp "llama-$TAG-bin-macos-arm64.tar.gz"
          append_asset windows x86_64 cuda 12.4 zip ggml-org/llama.cpp "llama-$TAG-bin-win-cuda-12.4-x64.zip" "cudart-llama-bin-win-cuda-12.4-x64.zip"
          append_asset windows x86_64 cuda 13.3 zip ggml-org/llama.cpp "llama-$TAG-bin-win-cuda-13.3-x64.zip" "cudart-llama-bin-win-cuda-13.3-x64.zip"
          append_optional_asset windows x86_64 hip '' zip ggml-org/llama.cpp "$windows_amd"
          append_asset windows x86_64 vulkan '' zip ggml-org/llama.cpp "llama-$TAG-bin-win-vulkan-x64.zip"
          append_asset windows x86_64 cpu '' zip ggml-org/llama.cpp "llama-$TAG-bin-win-cpu-x64.zip"

          jq -n --arg tag "$TAG" --arg publishedAt "$(date -u +%FT%TZ)" \
            --argjson artifacts "$entries" \
            '{schemaVersion:1,channel:"stable",tag:$tag,publishedAt:$publishedAt,artifacts:$artifacts}' \
            > llamacpp-release.json
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          minisign -S -s minisign.key -m llamacpp-release.json -x llamacpp-release.json.minisig
          minisign -Vm llamacpp-release.json -P 'RWR+94+uka+PJB5Wbmak5GN2J+eZjIgoj3PGFH4dAoqhBuCfIFjBy6u7' \
            -x llamacpp-release.json.minisig
          jq -e --arg tag "$TAG" '
            .schemaVersion == 1 and .tag == $tag
            and (.artifacts | length) >= 9
            and ([.artifacts[] | "\(.os)/\(.arch)/\(.backend)/\(.variant // "")"] | unique | length)
              == (.artifacts | length)
          ' llamacpp-release.json >/dev/null

      - name: Publish versioned catalog, then promote stable channel
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally does not check out the repository. Tell the
          # GitHub CLI which repository to use instead of making it infer one
          # from a local .git directory.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" llamacpp-release.json llamacpp-release.json.minisig --clobber
          if ! gh release view llamacpp-stable >/dev/null 2>&1; then
            gh release create llamacpp-stable --title 'llama.cpp stable channel' \
              --notes 'Machine-readable LocalLMOS-supported llama.cpp release channel.' \
              --latest=false --target "$GITHUB_SHA"
          fi
          # The stable pointer is updated last, after every referenced asset and
          # the immutable versioned catalog are available.
          gh release upload llamacpp-stable llamacpp-release.json llamacpp-release.json.minisig --clobber

  # Every published build creates a bNNNNN release + git tag; left alone they
  # accumulate forever. Keep only the newest $KEEP prebuilt releases and delete
  # the rest (with their tags). Never touches llamacpp-stable or any non-b tag,
  # and always keeps two referenced tags regardless of age: the blessed default
  # pinned in service/LLAMACPP_VERSION (what the installers download by default)
  # and whatever tag the desktop stable channel currently points at. Deleting
  # either would 404 the CUDA download for installs that resolve to it.
  cleanup:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: "5"
    steps:
      - uses: actions/checkout@v4 # for service/LLAMACPP_VERSION (the pinned tag)
      - name: Prune old llama.cpp prebuilt releases
        run: |
          set -euo pipefail
          # The blessed tag the installers pin by default (first non-comment line).
          pinned="$(awk 'NF && $1 !~ /^#/ {gsub(/[ \t\r]/,"",$0); print; exit}' \
            service/LLAMACPP_VERSION 2>/dev/null || true)"
          # The tag the desktop stable channel currently resolves to.
          stable_tag="$(curl -fsSL \
            "https://github.com/$GH_REPO/releases/download/llamacpp-stable/llamacpp-release.json" \
            | jq -r '.tag // empty' 2>/dev/null || true)"
          echo "Protected tags: pinned='$pinned' stable='$stable_tag'"

          mapfile -t old < <(
            gh release list --limit 200 --json tagName,createdAt \
              --jq 'map(select(.tagName | test("^b[0-9]+$")))
                    | sort_by(.createdAt) | reverse
                    | .[(env.KEEP | tonumber):] | .[].tagName'
          )
          for tag in "${old[@]}"; do
            if [[ "$tag" == "$pinned" || "$tag" == "$stable_tag" ]]; then
              echo "Keeping $tag (still referenced by installers/stable channel)"
              continue
            fi
            echo "Deleting old prebuilt release + tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
