[package]
name = "locallmos-agent"
version = "0.0.1"
description = "LocaLLMOS agent — monitors and manages local LLM runtimes on a rig"
edition = "2021"
rust-version = "1.77"

[lib]
name = "locallmos_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
sysinfo = "0.32"
nvml-wrapper = "0.10"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
# Coding harness: workspace file search (regex) and directory walking.
regex = "1"
walkdir = "2"
url = "2"
# Self-update: verify the release artifact then atomically swap our own binary.
sha2 = "0.10"
minisign-verify = "0.2"
self-replace = "1"
semver = "1"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# By default the agent refuses free-form shell commands; opt in per build.
allow-shell = []
